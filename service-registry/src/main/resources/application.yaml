server:
  port: 8761

spring:
  application:
    name: service-registry

eureka:
  client:
    # The server must not register with itself
    register-with-eureka: false
    fetch-registry: false
  server:
    # Disable self-preservation for local dev (production: enable it)
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    # How long to wait before evicting an unreachable instance
    response-cache-update-interval-ms: 5000
  dashboard:
    enabled: true
    path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN